services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: workload
      POSTGRES_USER: workload
      POSTGRES_PASSWORD: workload_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workload -d workload"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - workload-postgres-data:/var/lib/postgresql/data

volumes:
  workload-postgres-data:
