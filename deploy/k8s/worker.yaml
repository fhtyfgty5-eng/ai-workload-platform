apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-worker
  namespace: workload-tasks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: worker
          image: workload-worker:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
