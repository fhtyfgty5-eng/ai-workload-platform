apiVersion: batch/v1
kind: Job
metadata:
  name: module6-action-demo
  namespace: workload-tasks
  labels:
    app.kubernetes.io/name: workload-task
    workload.experiment: module6
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 30
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-task
        workload.experiment: module6
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: action
          image: workload-action:local
          imagePullPolicy: Never
          command: ["/action"]
          args: ["document.normalize", "{\"source\":\"  kubernetes   action  \"}"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
              ephemeral-storage: "8Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
              ephemeral-storage: "8Mi"
